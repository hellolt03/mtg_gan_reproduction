[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-gan-reproduction"
version = "0.1.0"
description = "Independent, documented MTG-GAN paper reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "drain3>=0.9.11", "sentence-transformers>=3.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mtg-gan = "mtg_gan.cli:main"

[tool.setuptools.packages.find]
include = ["mtg_gan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
